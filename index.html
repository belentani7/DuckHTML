<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="description" content="Duck HTML — acceso directo a la herramienta Duck.">
<title>Duck HTML — Direct Access</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#030303;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#172018 0,#080b09 28%,#030303 70%)}canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.7}.scene{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.glass{width:min(760px,92vw);padding:clamp(42px,8vw,96px) 28px;border:1px solid #ffffff18;border-radius:36px;background:#ffffff08;backdrop-filter:blur(22px);box-shadow:0 30px 120px #000, inset 0 1px #ffffff12}.duck{font-size:clamp(64px,12vw,120px);filter:drop-shadow(0 0 30px #b8ff6a44);animation:float 4s ease-in-out infinite}.eyebrow{letter-spacing:.35em;font-size:11px;text-transform:uppercase;opacity:.55;margin:18px 0}h1{font-size:clamp(48px,10vw,104px);letter-spacing:-.07em;margin:0;font-weight:800}p{opacity:.62;max-width:480px;margin:20px auto 34px;line-height:1.6}.enter{display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;border:1px solid #ffffff22;background:#f5f5f5;color:#050505;text-decoration:none;font-weight:750;transition:.25s transform,.25s box-shadow}.enter:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 50px #b8ff6a30}.direct{margin-top:20px;font-size:11px;letter-spacing:.12em;opacity:.35;text-transform:uppercase}@keyframes float{50%{transform:translateY(-10px) rotate(-2deg)}}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<main class="scene"><section class="glass">
<div class="duck">🦆</div><div class="eyebrow">Direct access · Duck</div><h1>DUCK HTML</h1>
<p>La puerta directa a la herramienta Duck. Sin pasar por el perfil. Entra y empieza.</p>
<a class="enter" href="./tool/" aria-label="Abrir Duck HTML">ENTRAR EN DUCK <span>↗</span></a>
<div class="direct">Immersive HTML gateway</div>
</section></main>
<script>
const c=document.querySelector('#space'),x=c.getContext('2d');let w,h,p=[];function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';p=Array.from({length:Math.min(180,innerWidth/6)},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,d:.15+Math.random()*.5}))}function draw(){x.clearRect(0,0,w,h);x.fillStyle='#fff';p.forEach(a=>{a.y+=a.d;if(a.y>h)a.y=0;x.globalAlpha=.12+Math.random()*.35;x.beginPath();x.arc(a.x,a.y,a.r*devicePixelRatio,0,Math.PI*2);x.fill()});requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw();
</script>
</body></html>
